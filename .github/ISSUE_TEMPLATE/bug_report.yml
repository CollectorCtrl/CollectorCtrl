name: 🐛 Bug Report
description: Report a reproducible problem with CollectorCtrl
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix the issue quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
      placeholder: The Supervisor fails to connect when...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Be specific — numbered steps help us fix the issue faster.
      placeholder: |
        1. Install the server via install.sh on Ubuntu 22.04
        2. Start the supervisor with ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Management Server
        - Supervisor Agent
        - Web Console / Admin UI
        - Installer (Windows)
        - Installer (Linux)
        - Docker Image
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version and platform details.
      placeholder: |
        - CollectorCtrl version: 1.1.120
        - OS: Windows Server 2022 / Ubuntu 22.04
        - OTel Collector version/distribution:
        - Database: SQLite / PostgreSQL
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs & Screenshots
      description: Relevant excerpts from server.log or supervisor.log. Please redact tokens and credentials.
      render: text
    validations:
      required: false
